name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r webapp/requirements-web.txt
      - name: Run test suite
        run: python -m pytest --tb=short
      - name: Run pyflakes
        run: python -m pyflakes .
      - name: Run ruff
        run: python -m ruff check .
      - name: Run black check
        run: python -m black --check .
      - name: Run mypy
        run: python -m mypy .
      - name: Check for whitespace errors
        run: git diff --check
